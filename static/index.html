<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101419"><title>ShareBajar — The world's markets. One portfolio.</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"></head><body>
<aside class="sidebar"><a class="brand" href="#overview"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19 19 5M5 5h14v14"/></svg></span>sharebajar<span class="brand-dot">.</span></a><div class="workspace-label">YOUR WORKSPACE</div><nav id="nav"></nav><div class="sidebar-bottom"><div class="avatar">SB</div><div>Personal workspace<small>Stored on this device</small></div></div></aside>
<div class="shell"><header><button class="mobile-brand" data-view="overview">↗ sharebajar.</button><label class="searchbox"><span>⌕</span><input id="global-search" placeholder="Search any asset, anywhere…" aria-label="Search global assets"><kbd>/</kbd></label><div class="header-right"><span class="status-dot"></span><span>Market workspace</span><button id="currency-button" title="Change portfolio base currency">USD ▾</button></div></header><main id="main" tabindex="-1"></main><footer><span>SHAREBAJAR <span class="dim">/</span> GLOBAL MARKET INTELLIGENCE</span><span>Quotes may be delayed · Research & tracking only</span></footer></div>
<dialog id="detail"><button class="close" aria-label="Close dialog">×</button><div id="detail-body"></div></dialog><dialog id="holding-dialog"><button class="close" aria-label="Close dialog">×</button><h2>Record a holding</h2><p class="muted">Track an investment you already own.</p><form id="holding-form"><label>Asset<select name="asset" required></select></label><div class="form-row"><label>Quantity<input name="quantity" type="number" min="0.00000001" step="any" required></label><label>Purchase price<input name="price" type="number" min="0" step="any" required></label></div><div class="form-row"><label>Purchase date<input name="date" type="date" required></label><label>Currency<input name="currency" maxlength="3" pattern="[A-Za-z]{3}" required value="USD"></label></div><label>Portfolio<select name="portfolio"></select></label><label>Exchange or wallet (optional)<input name="location" maxlength="100"></label><button class="primary" type="submit">Save holding ↗</button><p class="muted small">Your holdings stay in this browser. Export a backup from Portfolio.</p></form></dialog><div id="toast" role="status"></div><script type="module" src="/app.js"></script></body></html>
