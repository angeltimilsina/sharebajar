name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (app, chain adapters, indexer)
        run: npm test
      - name: Indexer migrations (embedded Postgres)
        run: node services/indexer/src/index.ts --migrate
        env:
          INDEXER_PGLITE_DIR: memory://
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
