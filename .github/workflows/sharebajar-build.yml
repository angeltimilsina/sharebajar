name: Sharebajar build verification
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check-milestones.py
      - run: node --check static/tiger-wallet.js
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-plan
          path: |
            build-report.json
            next-build-prompt.json
